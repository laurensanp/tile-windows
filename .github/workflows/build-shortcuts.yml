name: Build iPad shortcuts
on:
  push:
    branches: [ipad-shortcut]
    paths: ['ipad/src/**', '.github/workflows/build-shortcuts.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cherri (Shortcuts compiler) is used only during the build, pinned to one commit, and never committed.
      - uses: actions/checkout@v4
        with: { repository: electrikmilk/cherri, ref: 98d5191ae121a6bcf663ed0e55495f4ee4c7a6e2, path: .cherri }
      - uses: actions/setup-go@v5
        with: { go-version-file: .cherri/go.mod }
      - name: Build Cherri
        run: cd .cherri && go build -o "$RUNNER_TEMP/cherri" .
      - name: Compile with Cherri, sign with HubSign
        run: |
          mkdir -p ipad/dist
          cd ipad/src
          for pair in "tile-windows:Tile Windows" "restore-windows:Restore Windows" "most-used-apps:Most Used Apps"; do
            f="${pair%%:*}"; n="${pair#*:}"
            "$RUNNER_TEMP/cherri" "$f.cherri" --skip-sign --debug --no-ansi 2>&1 | tail -5
            # Sign with HubSign (same request that signed the Hello test)
            curl -sS --fail -o "../dist/$n.shortcut" -F "shortcut=@$n""_unsigned.shortcut" -F "shortcutName=$n" https://hubsign.routinehub.services/sign
            head -c 4 "../dist/$n.shortcut" | grep -q AEA1
            mv "$n""_unsigned.shortcut" "$RUNNER_TEMP/"
          done
          mkdir -p "$RUNNER_TEMP/debug"; mv *.plist *_processed* "$RUNNER_TEMP/debug/" 2>/dev/null || true
          ls -la ../dist; test -f "../dist/Tile Windows.shortcut" && test -f "../dist/Restore Windows.shortcut"
      - name: Check every If has a value
        run: |
          python3 - <<'PY'
          import plistlib, glob, sys
          bad = 0
          for f in glob.glob(f"{__import__('os').environ['RUNNER_TEMP']}/debug/*.plist"):
              d = plistlib.load(open(f, 'rb'))
              for i, a in enumerate(d['WFWorkflowActions']):
                  p = a['WFWorkflowActionParameters']
                  if a['WFWorkflowActionIdentifier'] == 'is.workflow.actions.conditional' and p.get('WFControlFlowMode') == 0:
                      c = p.get('WFCondition')
                      has = any(k in p for k in ('WFNumberValue', 'WFConditionalActionString', 'WFAnotherNumber'))
                      print(f"{f.split('/')[-1]} #{i} cond={c} keys={sorted(k for k in p if k.startswith('WF'))}")
                      if c not in (100, 101) and not has:
                          bad += 1; print('   ^^^ MISSING VALUE')
          sys.exit(1 if bad else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-debug, path: "${{ runner.temp }}/debug" }
      - if: always()
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add ipad/dist; git commit -m "Built shortcuts [skip ci]" || exit 0
          git pull --rebase; git push
