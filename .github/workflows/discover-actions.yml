name: Discover Open App window parameters
on:
  push:
    branches: [ipad-shortcut]
    paths: ['.github/workflows/discover-actions.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search iPadOS simulator runtime
        run: |
          mkdir -p ipad/discover; cd ipad/discover
          R=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("platform")=="iOS" and x.get("isAvailable")]; print(r[-1]["runtimeRoot"])')
          echo "$R" | tee root.txt; ls "$R" | head
          S="$R/System/Library/PrivateFrameworks"
          find "$S" "$R/Applications/Shortcuts.app" "$R/System/Library/Frameworks" -type f -size +10k 2>/dev/null > all.txt
          wc -l all.txt
          while IFS= read -r f; do
            if strings -a "$f" 2>/dev/null | grep -q -E 'LeftThird|leftThird|MiddleThird|middleThird|WindowLocation|windowLocation'; then echo "$f"; fi
          done < all.txt > hits.txt
          cat hits.txt
          while IFS= read -r f; do echo "=== $f"; strings -a "$f" | grep -E 'Third|third|Leading|Trailing|WindowLocation|windowLocation|WindowSize|windowSize|Placement|WFOpenApp|WFSplit|SplitScreen|splitScreen|FullScreen|fullScreen' | sort -u | head -300; done < hits.txt > strings.txt
          while IFS= read -r f; do if grep -q -a 'is.workflow.actions.openapp' "$f" 2>/dev/null; then echo "$f"; fi; done < all.txt > openapp-files.txt
          cat openapp-files.txt
          while IFS= read -r f; do echo "=== $f"; strings -a "$f" | grep -E 'WFOpenApp|WFAppIdentifier|WFSelectedApp|openapp|WFWindow|WFSplit|WFApp' | sort -u | head -200; done < openapp-files.txt > openapp-strings.txt
          wc -l *.txt
      - name: Commit findings
        if: always()
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add ipad/discover; git commit -m "Discovery results [skip ci]" || exit 0
          git pull --rebase; git push
