# Runs the tests on a real Windows machine (GitHub-hosted), with the built-in Windows PowerShell 5.1.
name: Windows test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1, like on the user's PC (not pwsh)
    steps:
      - uses: actions/checkout@v5

      - name: Versions
        run: |
          $PSVersionTable | Format-Table -AutoSize | Out-String
          [Environment]::OSVersion.VersionString

      - name: Unit tests (Test.ps1)
        run: .\Test.ps1

      - name: Build Native.cs and Hotkeys.cs
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -Path .\Native.cs
          if (-not ('Tiler' -as [type])) { throw 'Native.cs did not load' }
          # Same call as Setup.ps1
          Add-Type -TypeDefinition (Get-Content .\Hotkeys.cs -Raw) -OutputAssembly .\TileWindowsHotkeys.exe -OutputType WindowsApplication
          if (-not (Test-Path .\TileWindowsHotkeys.exe)) { throw 'TileWindowsHotkeys.exe not built' }
          "built TileWindowsHotkeys.exe ($((Get-Item .\TileWindowsHotkeys.exe).Length) bytes)"

      - name: Smoke test with real windows (Tile, then undo with Restore)
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -Path .\Native.cs
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Show-Windows($what) {
              "--- $what ---"
              foreach ($h in [Tiler]::AppWindows([uint32]$PID)) { $p = 0; [void][Tiler]::GetWindowThreadProcessId($h, [ref]$p); $r = [Tiler]::Visible($h)
                  '{0,-12} x={1,5} y={2,5} w={3,5} h={4,5} max={5} min={6}' -f (Get-Process -Id $p).ProcessName, $r.L, $r.T, ($r.R - $r.L), ($r.B - $r.T), [Tiler]::IsZoomed($h), [Tiler]::IsIconic($h) }
          }
          function Save-Screen($file) {
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height; $g = [System.Drawing.Graphics]::FromImage($bmp)
              try { $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $bmp.Save($file) } catch { "screenshot failed: $_" } finally { $g.Dispose(); $bmp.Dispose() }
          }
          New-Item -ItemType Directory screenshots | Out-Null
          [System.Windows.Forms.Screen]::AllScreens | ForEach-Object { "screen $($_.DeviceName) $($_.Bounds) primary=$($_.Primary)" }

          1..3 | ForEach-Object { Start-Process notepad }
          Start-Sleep 3
          $np = @([Tiler]::AppWindows([uint32]$PID) | Where-Object { $p = 0; [void][Tiler]::GetWindowThreadProcessId($_, [ref]$p); (Get-Process -Id $p).ProcessName -eq 'notepad' })
          if ($np.Count -lt 3) { throw "expected 3 Notepad windows, found $($np.Count) (no desktop session?)" }
          # One maximized, one minimized, one normal: Ctrl+Alt+R must bring back each state.
          [void][Tiler]::ShowWindow($np[0], 3); [void][Tiler]::ShowWindow($np[2], 6); Start-Sleep 1
          $wins = @([Tiler]::AppWindows([uint32]$PID))
          $before = @{}; foreach ($w in $wins) { $before[[long]$w] = @([Tiler]::IsZoomed($w), [Tiler]::IsIconic($w), [Tiler]::Visible($w)) }
          $fg = [Tiler]::GetForegroundWindow()
          Show-Windows 'before'
          Save-Screen screenshots\1-before.png

          .\Tile-Windows.ps1
          Start-Sleep 1
          Show-Windows 'after Tile-Windows.ps1'
          Save-Screen screenshots\2-tiled.png
          $shown = @($wins | Where-Object { -not [Tiler]::IsIconic($_) })   # minimized ones all sit at -32000 and would 'overlap'
          if ($shown.Count -lt 2) { throw "expected at least 2 tiled windows, got $($shown.Count)" }
          $rects = @($shown | ForEach-Object { [Tiler]::Visible($_) })
          for ($i = 0; $i -lt $rects.Count; $i++) { for ($j = $i + 1; $j -lt $rects.Count; $j++) { $a = $rects[$i]; $b = $rects[$j]
              if ($a.L -lt $b.R - 2 -and $b.L -lt $a.R - 2 -and $a.T -lt $b.B - 2 -and $b.T -lt $a.B - 2) { throw "tiled windows overlap" } } }
          if ([Tiler]::GetForegroundWindow() -ne $fg) { throw "tiling moved the focus" }
          if (-not (Test-Path "$env:TEMP\tile-windows-undo.txt")) { throw "no undo state saved" }

          .\Tile-Windows.ps1   # a second press (another layout) must not overwrite the saved state
          Start-Sleep 1
          # An app "closed to the tray" (like Discord) only hides its window: Ctrl+Alt+R must not bring it back.
          [void][Tiler]::ShowWindow($np[1], 0); Start-Sleep 1
          .\Restore-Windows.ps1
          Start-Sleep 2   # maximizing is posted to the apps
          Show-Windows 'after Restore-Windows.ps1'
          Save-Screen screenshots\3-restored.png
          if ([Tiler]::IsWindowVisible($np[1])) { throw "Restore showed a hidden (closed to tray) window" }
          foreach ($w in $wins) { if ($w -eq $np[1]) { continue }; $b = $before[[long]$w]; $r = [Tiler]::Visible($w)
              if ([Tiler]::IsZoomed($w) -ne $b[0] -or [Tiler]::IsIconic($w) -ne $b[1]) { throw "window $w not back in its old state (max=$($b[0]) min=$($b[1]))" }
              if (-not $b[0] -and -not $b[1] -and ([math]::Abs($r.L - $b[2].L) -gt 2 -or [math]::Abs($r.T - $b[2].T) -gt 2 -or [math]::Abs($r.R - $b[2].R) -gt 2 -or [math]::Abs($r.B - $b[2].B) -gt 2)) {
                  throw "window $w not back at its old position" } }
          if ([Tiler]::GetForegroundWindow() -ne $fg) { throw "restoring moved the focus" }
          if (Test-Path "$env:TEMP\tile-windows-undo.txt") { throw "undo state not cleared" }
          'smoke test ok'

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

  windhawk-mod:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5

      - name: Get clang (llvm-mingw, the compiler Windhawk uses)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download --repo mstorsjo/llvm-mingw --pattern '*-ucrt-x86_64.zip' --dir $env:RUNNER_TEMP
          $zip = Get-ChildItem "$env:RUNNER_TEMP\*-ucrt-x86_64.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath $env:RUNNER_TEMP
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\llvm-mingw-*" -Directory | Select-Object -First 1).FullName + '\bin'
          Add-Content $env:GITHUB_PATH $bin
          "using $($zip.Name)"

      - name: Compile the mod as Windhawk does (clang, C++23, 64 and 32 bit)
        working-directory: windhawk
        run: |
          clang++ --version
          # Windhawk builds every mod for x86 too, where Win32 callbacks must be stdcall.
          foreach ($cxx in 'x86_64-w64-mingw32-clang++', 'i686-w64-mingw32-clang++') {
              "== $cxx"
              & $cxx -std=c++23 -DUNICODE -D_UNICODE -DWINVER=0x0A00 -D_WIN32_WINNT=0x0A00 -Wall -Werror -Wno-cast-function-type-mismatch -Wno-unknown-warning-option -fsyntax-only -I test/stub -include test/windhawk_api_stub.h tile-windows.wh.cpp
              if ($LASTEXITCODE) { throw "mod does not compile with $cxx" }
          }

      - name: Build the test harness
        working-directory: windhawk/test
        run: |
          python -m pip install --quiet pyyaml
          python settings_defaults.py ..\tile-windows.wh.cpp settings.txt
          if ($LASTEXITCODE) { throw "settings block does not parse" }
          clang++ -std=c++23 -municode -DUNICODE -D_UNICODE -DWINVER=0x0A00 -D_WIN32_WINNT=0x0A00 -O2 -I stub harness.cpp -o harness.exe -ldwmapi -lshell32 -lgdi32 -static
          if ($LASTEXITCODE) { throw "harness does not compile" }

      - name: Layout and settings tests (same cases as Test.ps1)
        working-directory: windhawk/test
        run: |
          .\harness.exe settings.txt layout
          if ($LASTEXITCODE) { throw "layout tests failed" }

      - name: Live test (real windows, real hotkeys)
        working-directory: windhawk/test
        run: |
          .\harness.exe settings.txt live
          $rc = $LASTEXITCODE
          Add-Type -AssemblyName System.Drawing
          Get-ChildItem screenshots\*.bmp -ErrorAction SilentlyContinue | ForEach-Object {
              $img = [System.Drawing.Image]::FromFile($_.FullName); $img.Save(($_.FullName -replace '\.bmp$', '.png'), [System.Drawing.Imaging.ImageFormat]::Png); $img.Dispose(); Remove-Item $_.FullName }
          if ($rc) { throw "live test failed" }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mod-screenshots
          path: windhawk/test/screenshots
          if-no-files-found: ignore

  windhawk-real:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5

      - name: Install Windhawk, install the mod with windhawk-cli, press the hotkeys
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\windhawk\test\windhawk-real.ps1

      - name: Screenshots of the Windhawk UI with the mod
        if: always()
        continue-on-error: true
        run: .\windhawk\test\windhawk-ui.ps1

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windhawk-screenshots
          path: windhawk/test/screenshots-windhawk
          if-no-files-found: ignore
